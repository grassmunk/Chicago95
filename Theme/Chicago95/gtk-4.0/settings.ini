[Settings]
# Three Windows 95 behaviours that CSS cannot express. Only the keys GTK4 still reads are
# here: gtk-3.0/settings.ini also carries gtk-auto-mnemonics, gtk-visible-focus and
# gtk-menu-images, and all three were dropped in GTK4, so copying that file wholesale
# would have added three dead keys.
#
# HOW FAR THIS ACTUALLY REACHES, measured on GTK 4.22.4 in an isolated XDG sandbox rather
# than assumed:
#   - The file IS read from the theme directory. gtk-primary-button-warps-slider flips to
#     FALSE from here, both under GTK_THEME and through the gtk-theme setting.
#   - gtk-enable-animations and gtk-overlay-scrolling do NOT flip while a GNOME session is
#     running, because org.gnome.desktop.interface enable-animations / overlay-scrolling
#     outrank the theme file. Putting the same two keys in ~/.config/gtk-4.0/settings.ini
#     does not help either - the XSettings source still wins - which is why the installer
#     does not write that file.
# So on GNOME these two are inert and the user has to set the gsettings keys; INSTALL.md
# gives the commands. On a session with no XSettings daemon they apply from here. They are
# kept regardless: they are the correct declaration of intent, they cost nothing, and they
# are the only thing that works on the non-GNOME half of the target audience.

# Win95 scrollbars are always-visible 16px gutters, never an overlay indicator that fades
# in on approach. gtk-containers.css can restyle the bar but cannot change the behaviour.
gtk-overlay-scrolling = false

# Chicago95 is deliberately unanimated. GTK4 fades and slides popovers, stack pages and
# revealers in C rather than through a CSS transition, so `transition: none` in the
# stylesheet cannot reach them - this key is the only lever there is.
gtk-enable-animations = false

# Clicking a scrollbar trough or a scale in Windows 95 pages towards the click; it does
# not teleport the slider to the pointer. This is the one key here that GTK4 honours from
# the theme directory on every session, and it is carried over from gtk-3.0/settings.ini.
gtk-primary-button-warps-slider = false
